name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: mypy src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest --cov=agentic_discipline --cov-report=term-missing --cov-report=xml --cov-report=json:coverage.json
      - run: python scripts/coverage_gate.py --report coverage.json --min-line 90 --min-branch 85
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage.xml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Smoke test installed wheel and packaged bootstrap
        shell: bash
        run: |
          python -m venv smoke-venv
          smoke-venv/bin/pip install dist/*.whl
          mkdir -p smoke-project
          touch smoke-project/pyproject.toml
          smoke-venv/bin/agentic-discipline init --target smoke-project
          git -C smoke-project init
          cd smoke-project
          ../smoke-venv/bin/agentic-discipline doctor

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/repo_check.py
      - run: python -m agentic_discipline doctor

  # Four shards run at once. A pull request mutates only the files its diff can
  # affect; main and a manual run mutate each shard's whole tree. `mutation` below
  # stays the single check: it passes only when every shard does.
  mutation-shard:
    name: mutation (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [assurance, control, verifier, core]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch the pull request base
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - id: scope
        env:
          MUTATION_EVENT: ${{ github.event_name }}
          MUTATION_BASE: origin/${{ github.base_ref }}
        run: python scripts/mutation_scope.py --shard ${{ matrix.shard }}
      - name: Run mutmut
        if: steps.scope.outcome == 'success' && steps.scope.outputs.count != '0'
        run: mutmut run
      - name: Export canonical mutation evidence
        if: always() && steps.scope.outcome == 'success' && steps.scope.outputs.count != '0'
        run: mutmut export-cicd-stats
      - name: Enforce mutation outcome
        if: always() && steps.scope.outcome == 'success' && steps.scope.outputs.count != '0'
        env:
          MUTATION_EXCEPTIONS: policies/mutation-exceptions.json
        run: python scripts/mutation_gate.py --report mutants/mutmut-cicd-stats.json --scope mutation-scope.txt
      # Per-mutant outcomes, so survivors can be triaged by module without re-running.
      - uses: actions/upload-artifact@v7
        if: always() && steps.scope.outcome == 'success' && steps.scope.outputs.count != '0'
        with:
          name: mutation-stats-${{ matrix.shard }}
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && steps.scope.outcome == 'success' && steps.scope.outputs.count != '0'
        with:
          name: mutation-outcomes-${{ matrix.shard }}
          path: mutants/**/*.meta
          if-no-files-found: error
          retention-days: 14

  mutation:
    name: mutation
    needs: mutation-shard
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: |
          echo "mutation shards: ${{ needs.mutation-shard.result }}"
          test "${{ needs.mutation-shard.result }}" = "success"
