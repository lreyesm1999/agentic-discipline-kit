name: Release Artifact

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build pip-audit
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: pip-audit --format cyclonedx-json --output sbom.json
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: |
            dist/*
            sbom.json
