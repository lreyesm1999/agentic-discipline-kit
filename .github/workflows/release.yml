name: Release Artifact

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build pip-audit
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: pip-audit --format cyclonedx-json --output sbom.json
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: |
            dist/*
            sbom.json

  standalone:
    name: Standalone ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pyinstaller
      - run: pyinstaller --clean --noconfirm packaging/agentic-discipline.spec
      - name: Smoke test standalone executable (Unix)
        if: runner.os != 'Windows'
        run: |
          ./dist/agentic-discipline --version
          ./dist/agentic-discipline init --target standalone-smoke
          tar -czf "agentic-discipline-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" -C dist agentic-discipline
      - name: Smoke test standalone executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\dist\agentic-discipline.exe --version
          .\dist\agentic-discipline.exe init --target standalone-smoke
          Compress-Archive -LiteralPath .\dist\agentic-discipline.exe -DestinationPath "agentic-discipline-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "agentic-discipline-*"
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ runner.os }}-${{ runner.arch }}
          path: agentic-discipline-*

  publish:
    needs: [build, standalone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes
