name: Release Artifact

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build pip-audit
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: pip-audit --format cyclonedx-json --output sbom.json
      - uses: actions/attest@v4
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@v7
        with:
          name: python-distribution
          path: |
            dist/*
            sbom.json

  standalone:
    name: Standalone ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macOS is left out until CI runs the test suite there; macOS users install
        # with pipx, which the npm launcher points them to.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pyinstaller
      - run: pyinstaller --clean --noconfirm packaging/agentic-discipline.spec
      - name: Smoke test standalone executable (Unix)
        if: runner.os != 'Windows'
        run: |
          ./dist/agentic-discipline --version
          ./dist/agentic-discipline init --target standalone-smoke
          tar -czf "agentic-discipline-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" -C dist agentic-discipline
      - name: Smoke test standalone executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\dist\agentic-discipline.exe --version
          .\dist\agentic-discipline.exe init --target standalone-smoke
          Compress-Archive -LiteralPath .\dist\agentic-discipline.exe -DestinationPath "agentic-discipline-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
      - uses: actions/attest@v4
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: "agentic-discipline-*"
      - uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ runner.os }}-${{ runner.arch }}
          path: agentic-discipline-*

  pypi:
    name: Publish to PyPI
    needs: [build, standalone]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # The artifact stores `dist/*` alongside `sbom.json`, so its internal root
      # is the workspace: downloading into `dist` would nest it as `dist/dist`
      # and twine would refuse the directory as a distribution.
      - uses: actions/download-artifact@v8
        with:
          name: python-distribution
          path: .
      - name: Confirm the distribution is where twine expects it
        run: ls -1 dist/*.whl dist/*.tar.gz
      # Trusted publishing: configure this repository, workflow and the `pypi`
      # environment as a publisher on PyPI. No API token is stored here.
      # `skip-existing` keeps a re-run of a partially failed release green.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  npm:
    name: Publish npm launcher
    needs: [standalone]
    runs-on: ubuntu-latest
    # Must match the Environment name registered on the package's trusted
    # publisher, and trusted publishing only runs on GitHub-hosted runners.
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # `registry-url` is deliberately omitted: it writes an .npmrc expecting
      # NODE_AUTH_TOKEN, and trusted publishing authenticates over OIDC instead.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Node 22 still ships npm 10, below the floor that understands OIDC.
      - run: npm install -g npm@^11.5.1
      - name: Verify the launcher version matches the tag
        working-directory: packaging/npm
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "packaging/npm/package.json is ${version}, tag is ${GITHUB_REF_NAME}" >&2
            exit 1
          }
      # No token: npm detects the OIDC environment and authenticates with a
      # short-lived credential. Provenance is attested automatically, so
      # `--provenance` is not passed. Re-running a release whose other job
      # failed must not fail here on a version the registry already has.
      - name: Publish
        working-directory: packaging/npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already published; nothing to do"
            exit 0
          fi
          npm publish --access public

  publish:
    needs: [build, standalone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes
          fi
