  <text x="72" y="232" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">Kit</text>
  <text x="72" y="284" fill="#DCE9F6" font-family="Arial, Helvetica, sans-serif" font-size="22">Move fast with AI agents.</text>
  <text x="72" y="316" fill="#DCE9F6" font-family="Arial, Helvetica, sans-serif" font-size="22">Keep production standards.</text>
  <rect x="72" y="350" width="202" height="3" rx="1.5" fill="#68F0C2"/>
  <text x="72" y="382" fill="#9FB9D1" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1">CONTRACTS  /  TESTS  /  EVIDENCE</text>
