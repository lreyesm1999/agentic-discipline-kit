[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-discipline-kit"
version = "2.1.0"
description = "Evidence-backed engineering controls for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Agentic Discipline Kit Contributors" }
]
keywords = [
  "ai-agents",
  "software-engineering",
  "quality-gates",
  "mutation-testing",
  "acceptance-testing",
  "agentic-coding",
  "software-quality"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing"
]
dependencies = [
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8",
  "build>=1.2",
  "hypothesis>=6.100",
  "mypy>=1.15",
  "mutmut>=3.4",
  "pip-audit>=2.8",
  "pre-commit>=4.0",
  "pyinstaller>=6.0",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "types-jsonschema>=4.23",
]

[project.scripts]
agentic-discipline = "agentic_discipline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/agentic-discipline" = ["AGENTS.md", "MASTER_PROMPT.md"]
"share/agentic-discipline/config/examples" = ["config/examples/dotnet.json", "config/examples/generic.json", "config/examples/python.json", "config/examples/typescript.json"]
"share/agentic-discipline/config/profiles" = ["config/profiles/*.json"]
"share/agentic-discipline/config" = ["config/risk-weights.json"]
"share/agentic-discipline/policies" = ["policies/*.md"]
"share/agentic-discipline/schemas" = ["schemas/*.json"]
"share/agentic-discipline/templates" = ["templates/*"]
"share/agentic-discipline/skills/01-requirements-intake" = ["skills/01-requirements-intake/SKILL.md"]
"share/agentic-discipline/skills/02-specification" = ["skills/02-specification/SKILL.md"]
"share/agentic-discipline/skills/03-acceptance-design" = ["skills/03-acceptance-design/SKILL.md"]
"share/agentic-discipline/skills/04-acceptance-compiler" = ["skills/04-acceptance-compiler/SKILL.md"]
"share/agentic-discipline/skills/05-task-planning" = ["skills/05-task-planning/SKILL.md"]
"share/agentic-discipline/skills/06-risk-classification" = ["skills/06-risk-classification/SKILL.md"]
"share/agentic-discipline/skills/07-implementation" = ["skills/07-implementation/SKILL.md"]
"share/agentic-discipline/skills/08-unit-testing" = ["skills/08-unit-testing/SKILL.md"]
"share/agentic-discipline/skills/09-property-testing" = ["skills/09-property-testing/SKILL.md"]
"share/agentic-discipline/skills/10-refactoring" = ["skills/10-refactoring/SKILL.md"]
"share/agentic-discipline/skills/11-crap-analysis" = ["skills/11-crap-analysis/SKILL.md"]
"share/agentic-discipline/skills/12-quality-gates" = ["skills/12-quality-gates/SKILL.md"]
"share/agentic-discipline/skills/13-differential-mutation" = ["skills/13-differential-mutation/SKILL.md"]
"share/agentic-discipline/skills/14-architecture" = ["skills/14-architecture/SKILL.md"]
"share/agentic-discipline/skills/15-security" = ["skills/15-security/SKILL.md"]
"share/agentic-discipline/skills/16-integrity-audit" = ["skills/16-integrity-audit/SKILL.md"]
"share/agentic-discipline/skills/17-independent-review" = ["skills/17-independent-review/SKILL.md"]
"share/agentic-discipline/skills/18-qa" = ["skills/18-qa/SKILL.md"]
"share/agentic-discipline/skills/19-release-evidence" = ["skills/19-release-evidence/SKILL.md"]
"share/agentic-discipline/skills/20-agent-retrospective" = ["skills/20-agent-retrospective/SKILL.md"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["agentic_discipline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["agentic_discipline"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.mutmut]
source_paths = ["src/agentic_discipline/"]
pytest_add_cli_args_test_selection = ["tests/"]
mutate_only_covered_lines = true
